[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-threat-modeling-series"
version = "1.0.0"
description = "Campus Threat Modeling Workshop Series & Automated STRIDE/DREAD Assessment Toolkit"
authors = [{ name = "Pritpal Sandhu" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "streamlit>=1.28.0",
    "pandas>=2.0.0"
]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
